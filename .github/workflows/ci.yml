name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gamestation
          POSTGRES_PASSWORD: gamestation-ci
          POSTGRES_DB: gamestation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamestation -d gamestation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://gamestation:gamestation-ci@localhost:5432/gamestation?schema=gamestation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: gamestation-e2e
      JWT_SECRET: gamestation-ci-secret-that-is-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose up --build -d
      - run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/api/health
      - run: npm run e2e
      - if: always()
        run: docker compose down -v
